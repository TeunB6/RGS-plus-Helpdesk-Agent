# RGS+ helpdesk vertical: a chatbot inside the RGS+ application that answers
# from the RGS+ Confluence knowledge base and drafts a Jira ticket when the
# knowledge base cannot answer.
#
# Two plugins:
#   atlassian    -> Confluence (knowledge base, read-only) + Jira (search, read,
#                   DRY-RUN ticket drafting). Atlassian Cloud REST v3 / Confluence v2.
#   import_check -> validates a filled-in RGS+ Excel import against the
#                   template's own uitleg sheet. Read-only, local, no network.
#                   Here because the RGS+ importer FAILS SILENTLY by design --
#                   rows are skipped, types default to 'utiliteit', fields are
#                   left unchanged, and nothing is ever reported. "Er gebeurt
#                   niets" is the normal symptom, so the cause cannot be found
#                   by reading the manual. Deterministic checks belong in a
#                   tool; the agent's job is to explain the result in Dutch.
#                   Needs `openpyxl` in the agent image.
#
# Mail is deliberately absent. RGS+ customers already mail the helpdesk
# address and Jira turns that into a ticket automatically; the chatbot is a
# second front door to the same project, not a mail client. Nothing here
# needs mailbox access, and nothing should be added that does.
#
# READ-ONLY BY DESIGN. The Atlassian API token in use carries read/write
# access, so ticket creation is deliberately a DRY RUN: jira_create_ticket
# validates the ticket, renders the exact payload Jira would receive, saves it
# under ~/.hermes/jira-dryrun/ for a human to submit, and returns it. There is
# no POST in that code path. The agent is instructed never to quote a ticket
# key, because none is assigned.
# To enable real writes later: implement POST /rest/api/3/issue in
# library/tools/support/atlassian/__init__.py behind an explicit
# ATLASSIAN_ALLOW_WRITES=true gate, then revisit the "no ticket key" rules in
# the jira-ticket-create skill.
#
# There is no transition, assign, close or delete tool either, so the bot
# cannot touch the helpdesk's workflow no matter what a user asks it to do.
# That is a capability boundary, not a prompt instruction -- keep it that way.
#
# Auth -- Atlassian Cloud REST uses HTTP Basic auth, NOT Bearer: the username
# is the account email, the password is the API token
# (developer.atlassian.com/cloud/jira/platform/basic-auth-for-rest-apis/).
# So JIRA_API_KEY alone is not enough; ATLASSIAN_EMAIL must be the exact
# account that owns the token, and the base URL comes from either
# ATLASSIAN_SITE_URL (classic token) or ATLASSIAN_CLOUD_ID (scoped token).
#
# NOTE ON TOKEN EXPIRY: unscoped Atlassian API tokens expired between
# 2026-03-14 and 2026-05-12. A token issued before that window may already be
# dead; its scoped replacement addresses the site by cloud id, which is why
# ATLASSIAN_CLOUD_ID exists as an alternative to ATLASSIAN_SITE_URL.
#
# No profiles. The client's SOUL.md agent runs the whole flow itself -- search
# the knowledge base, answer, or draft a ticket. A specialist would buy
# nothing here and cost a round trip.

description: "RGS+ helpdesk: answers customer questions from the Confluence knowledge base, escalating what it cannot answer to Jira ticket drafts (dry run)."

skills:
  - customer-service
  - confluence-knowledge-lookup
  - jira-ticket-create

tools:
  - atlassian
  - import_check

profiles: []

mcp: []

secrets:
  # Basic auth pair. Both required.
  - ATLASSIAN_EMAIL
  - JIRA_API_KEY
  # Base URL: set ATLASSIAN_SITE_URL for a classic token, or
  # ATLASSIAN_CLOUD_ID for a scoped one (cloud id wins when both are set).
  - ATLASSIAN_SITE_URL
  - ATLASSIAN_CLOUD_ID
  # Where customer-service tickets are drafted.
  - JIRA_PROJECT_KEY
  # Optional: comma-separated Confluence space keys to scope KB search so
  # internal/archived spaces don't pollute results.
  - CONFLUENCE_SPACE_KEYS
