[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx-stdout.log
stderr_logfile=/var/log/nginx-stderr.log

[program:hermes-webui]
command=/hermes-webui/ctl.sh start
directory=/hermes-webui
environment=HERMES_WEBUI_PYTHON="/usr/local/lib/hermes-agent/venv/bin/python3"
autostart=true
autorestart=true
stdout_logfile=/var/log/hermes-webui-stdout.log
stderr_logfile=/var/log/hermes-webui-stderr.log

[program:hermes-gateway]
command=/usr/local/bin/hermes gateway run
directory=/root
environment=HOME="/root",HERMES_HOME="/root/.hermes",HERMES_ALLOW_ROOT_GATEWAY="1"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/hermes-gateway-stdout.log
stderr_logfile=/var/log/hermes-gateway-stderr.log

[program:uppr-diag]
command=/usr/local/bin/uppr-diag.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/uppr-diag-stdout.log
stderr_logfile=/var/log/uppr-diag-stderr.log
