user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hermes_webui {
        server 127.0.0.1:8787;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;

        # Operator diagnostics dump. Refreshed every ~5s by the
        # `uppr-diag` supervisord program. Behind Caddy forward_auth on
        # the cloud side, so only the tenant owner can fetch it.
        location = /uppr-diag.txt {
            alias /var/uppr/diag.txt;
            default_type text/plain;
            add_header Cache-Control "no-store";
        }

        # Embedded-download fix client script (see agent/scripts/uppr-download.js).
        # Served here rather than proxied to hermes-webui, which does not
        # serve arbitrary root-level static files. index.html loads it via
        # <script src="/uppr-download.js"> (injected at image build time).
        location = /uppr-download.js {
            alias /var/uppr/uppr-download.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://hermes_webui;
            proxy_http_version 1.1;

            # Embedding support. The hermes webui emits its own framing
            # headers (X-Frame-Options + a frame-ancestors CSP) that
            # block being iframed. When this agent is meant to live
            # inside another app's page (EMBED_FRAME_ANCESTORS set),
            # start.sh writes this snippet to strip those upstream
            # headers and emit a frame-ancestors CSP scoped to the
            # allowed origin. When the var is unset the file is empty,
            # so a standalone agent keeps its own headers untouched.
            include /etc/nginx/uppr-frame.conf;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            # The webui rejects mutating requests (POST -> 403) when the
            # Origin header doesn't match the request Host. A hardcoded
            # "http://localhost" only worked when browsing via a localhost
            # tunnel; direct LAN access (http://<device-ip>) got 403 on every
            # POST (send chat, pause/delete cron). Mirror the Host instead so
            # the check passes for any hostname the UI is reached on.
            proxy_set_header Origin            "http://$host";

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }
    }
}
