# RGS+ — the helpdesk chatbot deployment.
#
# Shape follows bundles/rgsplus.yaml. Kept explicit rather than referencing
# the bundle so this file alone tells you what the running image contains.

skills:
  - customer-service
  - confluence-knowledge-lookup
  - rgsplus-faq-lookup
  - jira-ticket-create

tools:
  - atlassian
  - rgsplus-faq
  - import_check

# No specialists. The main agent (SOUL.md) runs the whole flow itself:
# search the two knowledge sources, answer with a citation, or draft a
# Jira ticket.
profiles: []

mcp: []

secrets:
  - ATLASSIAN_EMAIL
  - JIRA_API_KEY
  - ATLASSIAN_SITE_URL
  - ATLASSIAN_CLOUD_ID
  - JIRA_PROJECT_KEY
  - CONFLUENCE_SPACE_KEYS
